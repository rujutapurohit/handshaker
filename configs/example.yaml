# handshaker magcor over a dataset.  handshaker configs/example.yaml

mode: magcor
output_dir: out/magcor

filters:
  source: roman_filters        # roman_filters | soc  (soc: not available yet)
  root: /project2/rkessler/SURVEYS/ROMAN/USERS/rpurohit/handshaker/ROMAN_FILTERS

ice:
  source: thushara             # thushara (released) | soc
  thickness: mjd               # mjd | <fixed nm>
  # response_path:             # set for soc when available

# magcor is taken relative to this K-giant calibration star.
calib_star:
  model: kgiant                # kgiant | file
  # path: /path/to/kgiant.sed  # 2 cols (wave[A], flux); blackbody placeholder if omitted

reference_sca: 2

# A dataset the SED/SCA/MJD are read from (SNANA MODELSPEC .root).
observations: /project2/rkessler/SURVEYS/ROMAN/USERS/rpurohit/handshaker/tests/CODETEST_HANDSHAKER.root
